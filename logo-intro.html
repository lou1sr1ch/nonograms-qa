<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo intro — true-trace study</title>
<!--
  LOGO INTRO TRUE-TRACE STUDY (round 24, v2)
  His round-24 corrections to the v1 trace study:
    1. "like a pen" was a metaphor for the DRAWING ORDER/DIRECTION only — the
       finished frame must be the REAL wordmark, not handwritten-looking
       strokes. The QA build's wordmark IS Aghja (index.html hero-title,
       style.css --font-logo), so the v1 letterforms looking "veryyy different"
       meant something WAS wrong: v1's guide renders silently fell back to a
       system font, and the hand-traced centerlines described THAT font.
    2. Remove the pen-nib cursor dot entirely.
    3. Letters appear at FULL font weight as they're drawn (the revealed part
       is the true filled glyph, never a hairline that thickens).
    4. Background work is a separate task — not touched here.

  Construction:
    - Exact glyph outlines extracted from fonts/Aghja.otf with fonttools
      (11 unique glyphs for "Nonograms Original"; no ligatures in the font;
      advances/positions measured live with canvas so spacing and kerning
      match the browser's own layout of the wordmark).
    - The pen is a MASK: each glyph is filled with its true outline, clipped
      by a mask holding a wide round-capped "ink window" that advances along
      a hand-authored centerline (order/direction = pen path; window width
      90 font units vs Aghja's ~60-unit stems, so revealed ink is full weight).
    - The i-dots tap: a circle in the mask grows at the dot after the stem.
    - At finish every mask is removed — the final frame is the unmasked,
      mathematically exact wordmark. Speed/gaps unchanged from v1 (approved).
  Dev aids: ?freeze=<s> deterministic frame; ?guide=1 ghosts the live-rendered
  Aghja wordmark underneath. Reduced motion = finished wordmark.
-->
<style>
  @font-face { font-family: "Aghja"; src: url("fonts/Aghja.otf") format("opentype"); font-weight: 500; }
  :root { --espresso:#2d1f17; --foam:#faf3e6; --oat:#f1e7d3; --steam:#cfc4b0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:28px; padding:32px 16px;
         background:linear-gradient(115deg, var(--foam), var(--oat));
         font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         color:var(--espresso); }
  svg { width:min(1150px, 94vw); height:auto; display:block; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { background:var(--espresso); color:var(--foam); border:0;
         border-radius:9px; padding:8px 16px; font-size:13.5px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  label { font-size:12.5px; color:#6b5a4a; display:flex; gap:6px; align-items:center; }
  select { border:1px solid var(--steam); border-radius:8px; padding:6px 9px;
         background:var(--foam); color:var(--espresso); font-size:13px; }
  .note { font-size:12px; color:#8a7663; max-width:70ch; text-align:center; margin:0; }
  .note code { background:rgba(45,31,23,.08); border-radius:5px; padding:1px 5px; }
  #guide text { font-family:"Aghja", serif; font-weight:500; }
</style>
</head>
<body>
<svg id="wm" role="img" aria-label="Nonograms Original — true-trace logo study"></svg>
<div class="controls">
  <button id="replay">Replay</button>
  <label>speed
    <select id="speed">
      <option value="0.6">0.6×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
  </label>
</div>
<p class="note">True-trace v2 — the real Aghja wordmark, written letter by letter, one word at a time.
Full font weight from the first visible pixel; no pen cursor. <code>?freeze=2.2</code> holds one frame;
<code>?guide=1</code> ghosts the live-rendered wordmark underneath (dev aid). Reduced motion = finished wordmark.</p>
<script>
"use strict";
const GLYPHS = {"N": {"adv": 500, "d": "M70 0C86 0 100 14 100 30V370C100 436 154 490 220 490C286 490 340 436 340 370V30C340 14 354 0 370 0C386 0 400 14 400 30V370C400 470 320 550 220 550C174 550 132 532 100 504V510C100 526 86 540 70 540C54 540 40 526 40 510V30C40 14 54 0 70 0Z"}, "O": {"adv": 500, "d": "M20 270C20 130 101 0 220 0C339 0 420 130 420 270C420 410 339 540 220 540C101 540 20 410 20 270ZM80 270C80 394 151 480 220 480C289 480 360 394 360 270C360 146 289 60 220 60C151 60 80 146 80 270Z"}, "a": {"adv": 420, "d": "M290 290C285 290 281 289 277 287C250 308 216 320 180 320C91 320 20 249 20 160C20 71 91 0 180 0C210 0 237 8 261 22C264 9 276 0 290 0C306 0 320 14 320 30V260C320 276 306 290 290 290ZM180 260C212 260 242 244 260 220V100C242 76 212 60 180 60C125 60 80 105 80 160C80 215 125 260 180 260Z"}, "g": {"adv": 420, "d": "M260 180V100C241 76 212 60 180 60C125 60 80 105 80 160C80 215 125 260 180 260C224 260 260 224 260 180ZM70 -226C70 -234 73 -241 79 -247C107 -275 142 -290 180 -290C258 -290 320 -228 320 -150V180C320 258 258 320 180 320C91 320 20 249 20 160C20 71 91 0 180 0C209 0 237 8 260 22V-150C260 -194 224 -230 180 -230C158 -230 139 -223 121 -205C115 -199 108 -196 100 -196C84 -196 70 -210 70 -226Z"}, "i": {"adv": 230, "d": "M70 440C70 423 83 410 100 410C117 410 130 423 130 440C130 457 117 470 100 470C83 470 70 457 70 440ZM110 320C94 320 80 306 80 290V30C80 14 94 0 110 0C126 0 140 14 140 30V290C140 306 126 320 110 320Z"}, "l": {"adv": 300, "d": "M220 30C220 46 206 60 190 60C152 60 120 92 120 130V410C120 448 152 480 190 480C206 480 220 494 220 510C220 526 206 540 190 540C118 540 60 482 60 410V130C60 58 118 0 190 0C206 0 220 14 220 30Z"}, "m": {"adv": 640, "d": "M70 0C86 0 100 14 100 30V170C100 219 141 260 190 260C228 260 260 228 260 190V30C260 14 274 0 290 0C306 0 320 14 320 30V170C320 219 361 260 410 260C448 260 480 228 480 190V30C480 14 494 0 510 0C526 0 540 14 540 30V190C540 262 482 320 410 320C364 320 323 299 295 266C271 299 233 320 190 320C156 320 125 309 100 290C100 306 86 320 70 320C54 320 40 306 40 290V30C40 14 54 0 70 0Z"}, "n": {"adv": 420, "d": "M70 0C86 0 100 14 100 30V170C100 219 141 260 190 260C228 260 260 228 260 190V30C260 14 274 0 290 0C306 0 320 14 320 30V190C320 262 262 320 190 320C156 320 125 309 100 290C100 306 86 320 70 320C54 320 40 306 40 290V30C40 14 54 0 70 0Z"}, "o": {"adv": 420, "d": "M20 160C20 71 91 0 180 0C269 0 340 71 340 160C340 249 269 320 180 320C91 320 20 249 20 160ZM80 160C80 215 125 260 180 260C235 260 280 215 280 160C280 105 235 60 180 60C125 60 80 105 80 160Z"}, "r": {"adv": 410, "d": "M310 30C310 34 309 39 307 43C290 78 280 118 280 160C280 202 290 242 307 277C309 281 310 286 310 290C310 305 298 320 280 320H70C54 320 40 306 40 290V30C40 14 54 0 70 0C86 0 100 14 100 30V260H236C226 230 220 195 220 160C220 108 232 60 253 17C258 6 269 0 280 0C298 0 310 15 310 30Z"}, "s": {"adv": 490, "d": "M150 50C150 12 218 0 250 0C339 0 410 71 410 160C410 249 339 320 250 320C241 320 232 315 227 309L7 49C2 43 0 37 0 30C0 14 13 0 30 0C39 0 47 4 53 11L263 259C311 253 350 211 350 160C350 105 305 60 250 60C229 60 211 65 196 75C191 78 186 80 180 80C165 80 150 67 150 50Z"}};
const LINES = {"N": ["M 70 22 C 68 150 68 380 70 512", "M 78 500 C 150 516 205 512 245 492 C 315 455 368 370 368 210 C 368 130 368 60 368 24"], "O": ["M 372 270 C 372 358 304 425 220 425 C 136 425 68 358 68 270 C 68 182 136 115 220 115 C 304 115 372 182 372 270 Z"], "o": ["M 298 160 C 298 224 245 276 180 276 C 115 276 62 224 62 160 C 62 96 115 44 180 44 C 245 44 298 96 298 160 Z"], "n": ["M 70 20 C 68 120 68 220 70 290", "M 78 288 C 120 302 175 304 215 300 C 262 295 288 275 288 235 C 289 160 289 80 288 22"], "g": ["M 298 160 C 298 224 245 276 180 276 C 115 276 62 224 62 160 C 62 96 115 44 180 44 C 245 44 298 96 298 160 Z", "M 300 92 C 304 -10 303 -110 290 -175 C 272 -232 208 -258 138 -248"], "r": ["M 70 20 C 68 120 68 220 70 290", "M 78 290 C 140 310 220 308 266 292 C 286 252 292 205 295 155 C 298 105 297 55 294 20"], "a": ["M 272 160 C 272 218 222 264 160 264 C 98 264 48 218 48 160 C 48 102 98 56 160 56 C 222 56 272 102 272 160 Z", "M 316 288 C 318 200 318 90 316 22"], "m": ["M 70 20 C 68 130 68 230 70 290", "M 78 288 C 115 302 170 304 205 300 C 250 295 288 278 288 238 C 289 165 289 80 288 22", "M 296 288 C 335 302 400 304 445 300 C 490 294 508 274 508 235 C 509 160 509 75 508 20"], "s": ["M 242 298 C 318 290 398 238 404 163 C 410 82 348 14 262 13 C 182 12 124 56 128 112 C 131 156 182 176 252 186 C 326 196 380 220 382 257 C 384 295 310 317 235 312 C 172 308 132 288 130 256 C 128 230 152 216 178 224"], "i": ["M 100 22 L 100 290"], "l": ["M 132 16 C 134 140 135 300 137 415 C 139 478 168 515 205 510 C 232 506 244 482 237 458"]};
const TAPS = {"i": {"x": 100, "y": 440, "r": 78}};
const WORDS = ["Nonograms", "Original"];
const STR = WORDS.join(" ");
const FS = 220, S = FS / 1000;            // Aghja is 1000 units/em
const LS = 2 * FS / 64;                   // app letter-spacing 2px at 64px, scaled
const INK_SPEED = 2400;                   // font units per second (pen hand speed)
const LETTER_GAP = 0.095, WORD_GAP = 0.55, START_PAUSE = 0.4, LINE_GAP = 0.02;
const TAP_DELAY = 0.05, DOT_POP = 0.13;
const BASE = 260;                         // baseline y in the viewBox
const NS = "http://www.w3.org/2000/svg";

const svg = document.getElementById("wm");
const params = new URLSearchParams(location.search);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let speed = 1, t0 = null, raf = null, running = false;
let units = [], taps = [], instances = [], masks = [], total = 0, FINISH = 0;

function el(tag) { return document.createElementNS(NS, tag); }

function build() {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = "500 " + FS + "px Aghja";
  ctx.letterSpacing = LS + "px";
  const cum = [0];
  for (let i = 1; i <= STR.length; i++) cum.push(ctx.measureText(STR.slice(0, i)).width);
  const totalW = cum[STR.length];
  svg.setAttribute("viewBox", "0 0 " + Math.ceil(totalW + 100) + " 340");

  const defs = el("defs");
  const gGuide = el("g");
  gGuide.setAttribute("id", "guide");
  gGuide.setAttribute("opacity", params.has("guide") ? "0.35" : "0");
  const gGlyph = el("g");
  svg.appendChild(defs);
  svg.appendChild(gGuide);
  svg.appendChild(gGlyph);

  let prev = null, wordIdx = 0;
  for (let i = 0; i < STR.length; i++) {
    const ch = STR[i];
    if (ch === " ") { wordIdx++; continue; }
    const px = 50 + cum[i];
    const inst = el("path");
    inst.setAttribute("d", GLYPHS[ch].d);
    inst.setAttribute("transform", "translate(" + px + " " + BASE + ") scale(" + S + ",-" + S + ")");
    inst.style.fill = "var(--espresso)";
    gGlyph.appendChild(inst);
    instances.push(inst);

    const mask = el("mask");
    const mid = "m" + i;
    // mask content shares the referencing glyph's LOCAL font-unit frame
    // (userSpaceOnUse = the path's own coordinate system, transform included
    // by the renderer when compositing) — no inner transform allowed.
    mask.setAttribute("id", mid);
    mask.setAttribute("maskUnits", "userSpaceOnUse");
    mask.setAttribute("x", "-200"); mask.setAttribute("y", "-400");
    mask.setAttribute("width", GLYPHS[ch].adv + 400); mask.setAttribute("height", "1200");
    const mg = el("g");
    mask.appendChild(mg);
    defs.appendChild(mask);
    inst.setAttribute("mask", "url(#" + mid + ")");
    masks.push("url(#" + mid + ")");

    for (const d of LINES[ch] || []) {
      const w = el("path");
      w.setAttribute("d", d);
      w.setAttribute("class", "win");
      w.setAttribute("stroke", "#fff");
      w.setAttribute("stroke-width", "90");
      w.setAttribute("fill", "none");
      w.setAttribute("stroke-linecap", "round");
      w.setAttribute("stroke-linejoin", "round");
      mg.appendChild(w);
    }
    let tapCircle = null;
    if (TAPS[ch]) {
      tapCircle = el("circle");  // font-unit coords: local frame, like the lines
      tapCircle.setAttribute("cx", TAPS[ch].x);
      tapCircle.setAttribute("cy", TAPS[ch].y);
      tapCircle.setAttribute("r", "0");
      tapCircle.setAttribute("fill", "#fff");
      mg.appendChild(tapCircle);
    }

    const wins = [...mg.querySelectorAll(".win")].map(p => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      return { p, len };
    });
    for (const w of wins) {
      let gap;
      if (!prev) gap = START_PAUSE;
      else if (prev.word !== wordIdx) gap = WORD_GAP;
      else if (prev.ch !== ch) gap = LETTER_GAP;
      else gap = LINE_GAP;
      const dur = Math.min(0.5, Math.max(0.2, w.len / INK_SPEED));
      const start = prev ? prev.end + gap : gap;
      const u = { p: w.p, len: w.len, start, dur, end: start + dur, ch, word: wordIdx };
      units.push(u);
      prev = u;
    }
    if (tapCircle) {
      taps.push({ c: tapCircle, t: prev.end + TAP_DELAY, r: TAPS[ch].r });
    }
  }

  WORDS.forEach((w, wi) => {
    const t = el("text");
    t.setAttribute("x", wi === 0 ? 50 : 50 + cum[WORDS[0].length + 1]);
    t.setAttribute("y", BASE);
    t.setAttribute("font-size", FS);
    t.setAttribute("letter-spacing", LS);
    t.style.fill = "var(--espresso)";
    t.textContent = w;
    gGuide.appendChild(t);
  });

  total = Math.max(...units.map(u => u.end), ...taps.map(t => t.t + DOT_POP), 0) + 0.25;
  FINISH = total - 0.25;
}

function paintAt(t) {
  for (const u of units) {
    const p = Math.min(1, Math.max(0, (t - u.start) / u.dur));
    u.p.style.strokeDashoffset = u.len * (1 - p);
  }
  for (const tp of taps) {
    const p = Math.min(1, Math.max(0, (t - tp.t) / DOT_POP));
    tp.c.setAttribute("r", tp.r * p);
  }
  const done = t >= FINISH;
  if (done) for (const inst of instances) inst.removeAttribute("mask");
  return done;
}
function unfinish() {
  for (let i = 0; i < instances.length; i++) instances[i].setAttribute("mask", masks[i]);
}
function frame(now) {
  if (t0 === null) t0 = now;
  const t = (now - t0) / 1000 * speed;
  if (paintAt(t) || t >= total) { running = false; return; }
  raf = requestAnimationFrame(frame);
}
function play() {
  if (raf) cancelAnimationFrame(raf);
  unfinish();
  t0 = null; running = true;
  raf = requestAnimationFrame(frame);
}
document.getElementById("replay").addEventListener("click", play);
document.getElementById("speed").addEventListener("change", e => { speed = +e.target.value; play(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
  else if (running) play();
});

// fonts.ready is NOT enough: nothing in the initial DOM uses Aghja (the only
// Aghja text is created inside build), so Chrome never downloads the font and
// canvas would measure a silent fallback — positions must wait for fonts.load.
document.fonts.load("500 " + FS + "px Aghja").then(() => {
  build();
  if (params.has("freeze")) {
    paintAt(parseFloat(params.get("freeze")) || 0);
  } else if (REDUCED) {
    paintAt(total);
  } else {
    play();
  }
});
</script>
</body>
</html>
